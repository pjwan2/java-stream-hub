services:
  mysql:
    image: mysql:8.4
    container_name: stream-hub-mysql
    environment:
      MYSQL_DATABASE: stream_hub
      MYSQL_USER: stream_user
      MYSQL_PASSWORD: stream_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:

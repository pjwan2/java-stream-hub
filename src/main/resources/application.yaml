spring:
  application:
    name: stream-hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stream_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:stream_user}
    password: ${DB_PASSWORD:stream_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8080
